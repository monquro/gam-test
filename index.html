<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHOTO DAY — 내 사진 찍는 날 찾기</title>
<meta name="description" content="공개 날씨·공휴일 데이터로 만든 3문항 퀴즈. 풀고 나면 사진 찍으러 올 달을 고르고 쿠폰을 받습니다.">
<meta name="theme-color" content="#fff3e8">
<!-- 글꼴: 영문·숫자는 둥근 Fredoka, 한글과 본문은 Pretendard -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <span class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="8" width="26" height="19" rx="5"/>
      <path d="M11 8l2-3.5h6L21 8"/>
      <circle cx="16" cy="17.5" r="5.2"/>
      <circle class="logo-dot" cx="24.5" cy="12.5" r="1.4"/>
    </svg>
    PHOTO DAY
  </span>
  <nav id="lang" class="lang" aria-label="Language"></nav>
</header>
<div id="marquee" class="marquee" aria-hidden="true"></div>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<main id="app">

  <!-- 1. 나라 → 지역 ─────────────────────────── -->
  <section id="view-home" class="view">
    <p id="shared-banner" class="banner" hidden></p>
    <div class="hero">
      <div class="hero-text">
        <h1><span data-t="heroTitle"></span></h1>
        <div class="stickers">
          <span class="sticker k1" data-t="stk1"></span>
          <span class="sticker k2" data-t="stk2"></span>
          <span class="sticker k3" data-t="stk3"></span>
        </div>
      </div>
      <!-- 포토부스 출력구에서 네 컷 사진이 내려온다 -->
      <div class="booth" aria-hidden="true">
        <div class="slot"></div>
        <div class="print-window">
          <div class="strip4"><span>☔</span><span>☀️</span><span>🎉</span><span>🌅</span></div>
        </div>
      </div>
    </div>
    <p class="step" data-t="step1"></p>
    <div id="regions"></div>
  </section>

  <!-- 2. 테마 고르기 ──────────────────────────── -->
  <section id="view-themes" class="view" hidden>
    <button id="btn-region" class="linkish"></button>
    <p class="step" data-t="step2"></p>
    <div id="themes" class="grid"></div>
    <p id="other-note" class="fineprint" data-t="otherNote" hidden></p>
  </section>

  <!-- 3. 문항 ─────────────────────────────────── -->
  <section id="view-quiz" class="view" hidden>
    <button id="btn-back" class="linkish" data-t="backThemes"></button>
    <div id="film" class="film" aria-hidden="true"></div>
    <p id="q-count" class="muted small"></p>
    <p id="q-local" class="local-badge" hidden></p>
    <h2 id="q-text"></h2>
    <div id="q-options" class="choices"></div>
    <div id="reveal" class="reveal" aria-live="polite" hidden></div>
    <button id="btn-next" class="primary" hidden></button>
  </section>

  <!-- 4. 결과 + 달 고르기 ─────────────────────── -->
  <section id="view-result" class="view" hidden>
    <div class="polaroid">
      <span class="ptag" data-t="myType"></span>
      <div class="photo"><span id="persona-emoji" aria-hidden="true"></span></div>
      <p id="persona" class="persona"></p>
      <p id="score" class="muted small"></p>
    </div>

    <p class="step" data-t="step3"></p>
    <p class="muted small" data-t="step3Lead"></p>
    <div id="months" class="months"></div>

    <label id="day-wrap" class="day" hidden>
      <span data-t="dayLabel"></span>
      <input type="date" id="day">
    </label>
    <button id="btn-coupon" class="primary" data-t="getCoupon" disabled></button>
    <button id="btn-more" class="ghost" data-t="moreThemes"></button>

    <div class="caveat"><b data-t="limits"></b><br><span id="caveat"></span></div>
    <p id="source" class="fineprint"></p>
  </section>

  <!-- 5. 쿠폰 — 출력구에서 인쇄돼 나온다 ──────── -->
  <section id="view-coupon" class="view" hidden>
    <div class="printer" aria-hidden="true"><span></span></div>
    <div class="ticket">
      <span class="sample">SAMPLE</span>
      <p class="t-small" data-t="couponFor"></p>
      <p id="c-off" class="t-big"></p>
      <p id="c-when" class="t-when"></p>
      <p class="t-small" data-t="stackable"></p>
      <div class="cut" aria-hidden="true"></div>
      <p class="t-small" data-t="showCode"></p>
      <p id="c-code" class="t-code"></p>
    </div>
    <div class="actions">
      <button id="btn-gcal" class="primary" data-t="gcal"></button>
      <button id="btn-cal" class="ghost" data-t="addCal"></button>
      <button id="btn-share" class="ghost" data-t="share"></button>
      <button id="btn-again" class="ghost" data-t="moreThemes"></button>
    </div>
    <p class="fineprint" data-t="sampleNote"></p>
  </section>

</main>

<div id="flash" class="flash" aria-hidden="true"></div>
<div id="confetti" class="confetti" aria-hidden="true"></div>
<script src="app.js"></script>
</body>
</html>
